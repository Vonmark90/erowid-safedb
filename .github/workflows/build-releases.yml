name: Build and Release Standalone Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "ErowidSafeDB" `
            --add-data "data;data" `
            --add-data "assets;assets" `
            gui.py
          mkdir release-win
          Copy-Item dist\ErowidSafeDB.exe release-win\
          Compress-Archive -Path release-win\* -DestinationPath ErowidSafeDB-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: ErowidSafeDB-Windows-x64.zip

  build-linux:
    name: Build Linux Standalone Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile \
            --name "ErowidSafeDB" \
            --add-data "data:data" \
            --add-data "assets:assets" \
            gui.py
          mkdir release-linux
          cp dist/ErowidSafeDB release-linux/
          tar -czvf ErowidSafeDB-Linux-x64.tar.gz -C release-linux ErowidSafeDB

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: ErowidSafeDB-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Standalone App Bundle (.zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native Cocoa Wrapper and Bundle Resources
        run: |
          mkdir -p bin
          swiftc -O -framework Cocoa -framework WebKit src_native/main.swift -o bin/ErowidSafeDB
          mkdir -p "Erowid SafeDB.app/Contents/MacOS" "Erowid SafeDB.app/Contents/Resources"
          cp bin/ErowidSafeDB "Erowid SafeDB.app/Contents/MacOS/ErowidSafeDB"
          cp gui.py "Erowid SafeDB.app/Contents/Resources/"
          cp -R erowid_safedb "Erowid SafeDB.app/Contents/Resources/"
          cp -R data "Erowid SafeDB.app/Contents/Resources/"
          cp -R assets "Erowid SafeDB.app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "Erowid SafeDB.app" ErowidSafeDB-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: ErowidSafeDB-macOS.zip

  publish-release:
    name: Publish Standalone GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: macos-binary

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" || -z "$TAG_NAME" ]]; then
            TAG_NAME="v2.5.0"
          fi
          gh release create "$TAG_NAME" \
            ErowidSafeDB-Windows-x64.zip \
            ErowidSafeDB-Linux-x64.tar.gz \
            ErowidSafeDB-macOS.zip \
            --title "Erowid SafeDB Pro $TAG_NAME — Standalone Applications" \
            --notes "### 🚀 Erowid SafeDB Standalone Releases

Pre-compiled, self-contained standalone applications for macOS, Windows, and Linux. No Python installation required!

- 🍏 **macOS**: Download \`ErowidSafeDB-macOS.zip\`, unzip, and double-click **Erowid SafeDB.app**.
- 🪟 **Windows**: Download \`ErowidSafeDB-Windows-x64.zip\`, unzip, and double-click **ErowidSafeDB.exe**.
- 🐧 **Linux**: Download \`ErowidSafeDB-Linux-x64.tar.gz\`, extract, and execute \`./ErowidSafeDB\`." \
            --clobber
