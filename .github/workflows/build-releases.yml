name: Build and Release Standalone Apps

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v2.5.0)'
        required: false
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "DrugHarmReductionCodex" --add-data "data;data" --add-data "assets;assets" gui.py
          Compress-Archive -Path dist\DrugHarmReductionCodex.exe -DestinationPath DrugHarmReductionCodex-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: DrugHarmReductionCodex-Windows-x64.zip

  build-linux:
    name: Build Linux Standalone Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onefile --name "DrugHarmReductionCodex" --add-data "data:data" --add-data "assets:assets" gui.py
          tar -czvf DrugHarmReductionCodex-Linux-x64.tar.gz -C dist DrugHarmReductionCodex

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: DrugHarmReductionCodex-Linux-x64.tar.gz

  build-macos:
    name: Build macOS Standalone App Bundle (.zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Native Cocoa Wrapper and Bundle Resources
        run: |
          mkdir -p bin
          swiftc -O -framework Cocoa -framework WebKit src_native/main.swift -o bin/DrugHarmReductionCodex
          mkdir -p "Drug Harm Reduction Codex and Overdose Radar.app/Contents/MacOS" "Drug Harm Reduction Codex and Overdose Radar.app/Contents/Resources"
          cp bin/DrugHarmReductionCodex "Drug Harm Reduction Codex and Overdose Radar.app/Contents/MacOS/DrugHarmReductionCodex"
          cp gui.py "Drug Harm Reduction Codex and Overdose Radar.app/Contents/Resources/"
          cp -R erowid_safedb "Drug Harm Reduction Codex and Overdose Radar.app/Contents/Resources/"
          cp -R data "Drug Harm Reduction Codex and Overdose Radar.app/Contents/Resources/"
          cp -R assets "Drug Harm Reduction Codex and Overdose Radar.app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "Drug Harm Reduction Codex and Overdose Radar.app" DrugHarmReductionCodex-macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: DrugHarmReductionCodex-macOS.zip

  publish-release:
    name: Publish Standalone GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: macos-binary

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="v2.5.0"
          fi

          echo "Target Release Tag: $TAG_NAME"

          cat << 'EOF' > release_notes.md
          ### 🚀 Drug Harm Reduction Codex and Overdose Radar Standalone Releases

          Pre-compiled, self-contained standalone applications for macOS, Windows, and Linux. No Python installation required!

          - 🍏 **macOS**: Download `DrugHarmReductionCodex-macOS.zip`, unzip, and launch **Drug Harm Reduction Codex and Overdose Radar.app**.
          - 🪟 **Windows**: Download `DrugHarmReductionCodex-Windows-x64.zip`, extract, and launch **DrugHarmReductionCodex.exe**.
          - 🐧 **Linux**: Download `DrugHarmReductionCodex-Linux-x64.tar.gz`, extract (`tar -xvf DrugHarmReductionCodex-Linux-x64.tar.gz`), and run `./DrugHarmReductionCodex`.
          EOF

          # Check if release exists; if so, upload assets to it. Otherwise create it.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading/overwriting standalone assets..."
            gh release upload "$TAG_NAME" DrugHarmReductionCodex-Windows-x64.zip DrugHarmReductionCodex-Linux-x64.tar.gz DrugHarmReductionCodex-macOS.zip --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" DrugHarmReductionCodex-Windows-x64.zip DrugHarmReductionCodex-Linux-x64.tar.gz DrugHarmReductionCodex-macOS.zip \
              --title "Drug Harm Reduction Codex and Overdose Radar $TAG_NAME" \
              --notes-file release_notes.md
          fi
